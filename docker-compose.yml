services:

  app:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - vendor:/app/vendor
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-technical_test}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-secret}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-http://localhost:8080}
      JWT_TTL: ${JWT_TTL:-3600}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-technical_test}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendor:
  mysql_data:
