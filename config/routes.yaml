# User endpoints
register:
  path: /api/users
  methods: [POST]

list_users:
  path: /api/users
  methods: [GET]

login:
  path: /api/auth/login
  methods: [POST]

get_user:
  path: /api/users/{id}
  methods: [GET]

delete_user:
  path: /api/users/{id}
  methods: [DELETE]

# Company endpoints
create_company:
  path: /api/companies
  methods: [POST]

list_companies:
  path: /api/companies
  methods: [GET]

get_company:
  path: /api/companies/{id}
  methods: [GET]

update_company:
  path: /api/companies/{id}
  methods: [PATCH]

delete_company:
  path: /api/companies/{id}
  methods: [DELETE]

# Shop endpoints
create_shop:
  path: /api/companies/{companyId}/shops
  methods: [POST]

list_shops:
  path: /api/shops
  methods: [GET]

get_shop:
  path: /api/shops/{id}
  methods: [GET]

update_shop:
  path: /api/shops/{id}
  methods: [PATCH]

delete_shop:
  path: /api/shops/{id}
  methods: [DELETE]
