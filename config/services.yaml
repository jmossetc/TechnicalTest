parameters:
  # Environment variable defaults
  env(DB_HOST):      '127.0.0.1'
  env(DB_PORT):      '3306'
  env(DB_DATABASE):  'technical_test'
  env(DB_USERNAME):  'app'
  env(DB_PASSWORD):  'secret'
  env(JWT_SECRET):   ''
  env(JWT_ISSUER):   'http://localhost:8080'
  env(JWT_AUDIENCE): 'http://localhost:8080'
  # jwt.ttl is set as an integer by ContainerFactory (avoids string-to-int coercion)

services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: false

  # ── Database ──────────────────────────────────────────────────────────────────

  PDO:
    class: PDO
    factory:
      - 'Mossetc\TechnicalTest\Shared\Infrastructure\DI\PdoFactory'
      - 'create'
    arguments:
      - '%env(DB_HOST)%'
      - '%env(DB_PORT)%'
      - '%env(DB_DATABASE)%'
      - '%env(DB_USERNAME)%'
      - '%env(DB_PASSWORD)%'

  # ── Repository ────────────────────────────────────────────────────────────────

  Mossetc\TechnicalTest\Auth\Infrastructure\Repository\UserRepository: ~

  Mossetc\TechnicalTest\Auth\Domain\Repository\UserRepositoryInterface:
    alias: 'Mossetc\TechnicalTest\Auth\Infrastructure\Repository\UserRepository'

  Mossetc\TechnicalTest\Auth\Infrastructure\Repository\UserRoleRepository: ~

  Mossetc\TechnicalTest\Auth\Domain\Repository\UserRoleRepositoryInterface:
    alias: 'Mossetc\TechnicalTest\Auth\Infrastructure\Repository\UserRoleRepository'

  # ── JWT ───────────────────────────────────────────────────────────────────────

  Mossetc\TechnicalTest\Auth\Infrastructure\Jwt\JwtConfig:
    arguments:
      - '%env(JWT_SECRET)%'
      - '%env(JWT_ISSUER)%'
      - '%env(JWT_AUDIENCE)%'
      - '%jwt.ttl%'

  Mossetc\TechnicalTest\Shared\Infrastructure\Clock\SystemClock: ~

  Psr\Clock\ClockInterface:
    alias: 'Mossetc\TechnicalTest\Shared\Infrastructure\Clock\SystemClock'

  Mossetc\TechnicalTest\Auth\Infrastructure\Jwt\LcobucciJwtTokenService: ~

  Mossetc\TechnicalTest\Auth\Domain\Service\TokenServiceInterface:
    alias: 'Mossetc\TechnicalTest\Auth\Infrastructure\Jwt\LcobucciJwtTokenService'

  # ── HTTP ──────────────────────────────────────────────────────────────────────

  Mossetc\TechnicalTest\Auth\Infrastructure\Jwt\JwtAuthMiddleware: ~

  Mossetc\TechnicalTest\Auth\Domain\Service\UserAuthorization: ~

  Mossetc\TechnicalTest\Auth\Application\Handler\RegisterUserHandler: ~

  Mossetc\TechnicalTest\Auth\Application\Handler\LoginUserHandler: ~

  Mossetc\TechnicalTest\Auth\Application\Handler\ListUsersHandler: ~

  # autoconfigure: true makes the container read #[AsHttpController] and add the tag.
  # To add a new controller: create the class with the attribute, add one line here.

  Mossetc\TechnicalTest\Auth\Presentation\Controller\RegisterUserController:
    autoconfigure: true

  Mossetc\TechnicalTest\Auth\Presentation\Controller\LoginUserController:
    autoconfigure: true

  Mossetc\TechnicalTest\Auth\Presentation\Controller\GetUserController:
    autoconfigure: true

  Mossetc\TechnicalTest\Auth\Presentation\Controller\ListUsersController:
    autoconfigure: true

  Mossetc\TechnicalTest\Auth\Presentation\Controller\DeleteUserController:
    autoconfigure: true

  # ── Company ───────────────────────────────────────────────────────────────────

  Mossetc\TechnicalTest\Company\Infrastructure\Repository\CompanyRepository: ~

  Mossetc\TechnicalTest\Company\Domain\Repository\CompanyRepositoryInterface:
    alias: 'Mossetc\TechnicalTest\Company\Infrastructure\Repository\CompanyRepository'

  Mossetc\TechnicalTest\Company\Application\Handler\CreateCompanyHandler: ~
  Mossetc\TechnicalTest\Company\Application\Handler\UpdateCompanyHandler: ~
  Mossetc\TechnicalTest\Company\Application\Handler\DeleteCompanyHandler: ~
  Mossetc\TechnicalTest\Company\Application\Handler\GetCompanyHandler: ~
  Mossetc\TechnicalTest\Company\Application\Handler\ListCompaniesHandler: ~

  Mossetc\TechnicalTest\Company\Presentation\Controller\CreateCompanyController:
    autoconfigure: true

  Mossetc\TechnicalTest\Company\Presentation\Controller\ListCompaniesController:
    autoconfigure: true

  Mossetc\TechnicalTest\Company\Presentation\Controller\GetCompanyController:
    autoconfigure: true

  Mossetc\TechnicalTest\Company\Presentation\Controller\UpdateCompanyController:
    autoconfigure: true

  Mossetc\TechnicalTest\Company\Presentation\Controller\DeleteCompanyController:
    autoconfigure: true

  # ── Routing ───────────────────────────────────────────────────────────────────

  Mossetc\TechnicalTest\Shared\Infrastructure\Http\RouteLoader: ~

  Symfony\Component\Routing\RouteCollection:
    factory:
      - '@Mossetc\TechnicalTest\Shared\Infrastructure\Http\RouteLoader'
      - 'load'
    arguments:
      - '%routes.config%'

  Mossetc\TechnicalTest\Shared\Infrastructure\Http\Router:
    public: true
    arguments:
      $controllers: !tagged_locator { tag: 'app.http_controller', index_by: 'route' }
