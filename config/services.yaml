parameters:
  # Environment variable defaults
  env(DB_HOST):      '127.0.0.1'
  env(DB_PORT):      '3306'
  env(DB_DATABASE):  'technical_test'
  env(DB_USERNAME):  'app'
  env(DB_PASSWORD):  'secret'
  env(JWT_SECRET):   ''
  env(JWT_ISSUER):   'http://localhost:8080'
  env(JWT_AUDIENCE): 'http://localhost:8080'
  # jwt.ttl is set as an integer by ContainerFactory (avoids string-to-int coercion)

services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: false

  # ── Database ──────────────────────────────────────────────────────────────────
  # Scalars and PHP constants cannot be autowired — factory + explicit args required.

  PDO:
    class: PDO
    factory:
      - 'Mossetc\TechnicalTest\Auth\Infrastructure\DI\PdoFactory'
      - 'create'
    arguments:
      - '%env(DB_HOST)%'
      - '%env(DB_PORT)%'
      - '%env(DB_DATABASE)%'
      - '%env(DB_USERNAME)%'
      - '%env(DB_PASSWORD)%'

  # ── Repository ────────────────────────────────────────────────────────────────

  Mossetc\TechnicalTest\Auth\Infrastructure\Repository\PdoUserRepository: ~

  Mossetc\TechnicalTest\Auth\Domain\UserRepositoryInterface:
    alias: 'Mossetc\TechnicalTest\Auth\Infrastructure\Repository\PdoUserRepository'

  # ── JWT ───────────────────────────────────────────────────────────────────────

  Mossetc\TechnicalTest\Auth\Infrastructure\Jwt\JwtConfig:
    arguments:
      - '%env(JWT_SECRET)%'
      - '%env(JWT_ISSUER)%'
      - '%env(JWT_AUDIENCE)%'
      - '%jwt.ttl%'

  Mossetc\TechnicalTest\Auth\Infrastructure\Clock\SystemClock: ~

  Psr\Clock\ClockInterface:
    alias: 'Mossetc\TechnicalTest\Auth\Infrastructure\Clock\SystemClock'

  Mossetc\TechnicalTest\Auth\Infrastructure\Jwt\LcobucciJwtTokenService: ~

  Mossetc\TechnicalTest\Auth\Domain\TokenServiceInterface:
    alias: 'Mossetc\TechnicalTest\Auth\Infrastructure\Jwt\LcobucciJwtTokenService'

  # ── HTTP — all autowired via type hints ───────────────────────────────────────

  Mossetc\TechnicalTest\Auth\Infrastructure\Http\JwtAuthMiddleware: ~

  Mossetc\TechnicalTest\Auth\Application\Handler\RegisterUserHandler: ~

  Mossetc\TechnicalTest\Auth\Application\Handler\LoginUserHandler: ~

  Mossetc\TechnicalTest\Auth\Infrastructure\Http\Controller\RegisterUserController: ~

  Mossetc\TechnicalTest\Auth\Infrastructure\Http\Controller\LoginUserController: ~

  Mossetc\TechnicalTest\Auth\Infrastructure\Http\Controller\GetUserController: ~

  # ── Routing ───────────────────────────────────────────────────────────────────
  # RouteCollection depends on a scalar path — factory + explicit arg required.

  Mossetc\TechnicalTest\Auth\Infrastructure\Http\RouteLoader: ~

  Symfony\Component\Routing\RouteCollection:
    factory:
      - '@Mossetc\TechnicalTest\Auth\Infrastructure\Http\RouteLoader'
      - 'load'
    arguments:
      - '%routes.config%'

  Mossetc\TechnicalTest\Auth\Infrastructure\Http\Router:
    public: true
